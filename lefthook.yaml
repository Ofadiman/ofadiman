pre-commit:
  parallel: true
  skip: [merge, rebase]
  jobs:
    - name: prettier
      file_types: ["not symlink"]
      run: mise exec -- pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    - name: typescript
      glob: ["*.ts", "tsconfig.json", "package.json", "pnpm-lock.yaml"]
      run: mise exec -- pnpm run typescript:check
